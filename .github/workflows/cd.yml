name: CD

on:
  workflow_run:
    workflows: ["CI"] # must match the 'name:' at top of your CI workflow
    types: [completed]

concurrency:
  group: cd-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Ensure Vercel secrets exist
        run: |
          test -n "${VERCEL_TOKEN}" || (echo "VERCEL_TOKEN is missing/empty" && exit 1)
          test -n "${VERCEL_ORG_ID}" || (echo "VERCEL_ORG_ID is missing/empty" && exit 1)
          test -n "${VERCEL_PROJECT_ID}" || (echo "VERCEL_PROJECT_ID is missing/empty" && exit 1)
          test -n "${RESEND_API_KEY}" || (echo "RESEND_API_KEY is missing/empty" && exit 1)
          test -n "${CONTACT_TO_EMAIL}" || (echo "CONTACT_TO_EMAIL is missing/empty" && exit 1)
          test -n "${OPENAI_API_KEY}" || (echo "OPENAI_API_KEY is missing/empty" && exit 1)
          test -n "${UPSTASH_REDIS_REST_URL}" || (echo "UPSTASH_REDIS_REST_URL is missing/empty" && exit 1)
          test -n "${UPSTASH_REDIS_REST_TOKEN}" || (echo "UPSTASH_REDIS_REST_TOKEN is missing/empty" && exit 1)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          CONTACT_TO_EMAIL: ${{ secrets.CONTACT_TO_EMAIL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}

      - name: Deploy to Vercel (prod)
        run: npx vercel --prod --token "${VERCEL_TOKEN}"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          CONTACT_TO_EMAIL: ${{ secrets.CONTACT_TO_EMAIL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
