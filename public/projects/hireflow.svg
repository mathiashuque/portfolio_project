<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Hireflow hiring pipeline</title>
  <desc id="desc">A dark blue hiring dashboard with candidate pipeline columns</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#081426"/>
      <stop offset="1" stop-color="#102a43"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#020617" flood-opacity=".45"/>
    </filter>
  </defs>
  <rect width="1200" height="900" fill="url(#bg)"/>
  <circle cx="1050" cy="80" r="280" fill="#38bdf8" opacity=".08"/>
  <circle cx="80" cy="850" r="330" fill="#6366f1" opacity=".09"/>
  <g filter="url(#shadow)">
    <rect x="90" y="95" width="1020" height="710" rx="30" fill="#0f1e33" stroke="#ffffff" stroke-opacity=".12"/>
    <rect x="90" y="95" width="1020" height="92" rx="30" fill="#13243b"/>
    <rect x="90" y="155" width="1020" height="32" fill="#13243b"/>
    <rect x="128" y="125" width="42" height="42" rx="12" fill="url(#glow)"/>
    <path d="M141 137v26m16-26v26m-16-13h16" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
    <text x="188" y="155" fill="#f8fafc" font-family="Arial,sans-serif" font-size="29" font-weight="700">Hireflow</text>
    <circle cx="1027" cy="146" r="20" fill="#223a58"/>
    <circle cx="1027" cy="141" r="7" fill="#94a3b8"/>
    <path d="M1016 158c3-10 19-10 22 0" fill="#94a3b8"/>
  </g>
  <text x="128" y="247" fill="#f8fafc" font-family="Arial,sans-serif" font-size="34" font-weight="700">Backend Engineer</text>
  <text x="128" y="280" fill="#94a3b8" font-family="Arial,sans-serif" font-size="18">Candidate pipeline · 12 active</text>
  <g font-family="Arial,sans-serif">
    <g transform="translate(128 325)">
      <text y="0" fill="#cbd5e1" font-size="17" font-weight="700">APPLIED</text><text x="180" fill="#64748b" font-size="16">4</text>
      <rect y="28" width="215" height="118" rx="15" fill="#172b45" stroke="#fff" stroke-opacity=".08"/>
      <circle cx="31" cy="63" r="14" fill="#38bdf8" opacity=".8"/><text x="55" y="68" fill="#e2e8f0" font-size="17" font-weight="600">Alice Morgan</text>
      <rect x="20" y="94" width="92" height="24" rx="12" fill="#38bdf8" opacity=".12"/><text x="34" y="111" fill="#7dd3fc" font-size="12">3 days ago</text>
      <rect y="164" width="215" height="118" rx="15" fill="#172b45" stroke="#fff" stroke-opacity=".08"/>
      <circle cx="31" cy="199" r="14" fill="#818cf8" opacity=".8"/><text x="55" y="204" fill="#e2e8f0" font-size="17" font-weight="600">Bob Chen</text>
      <rect x="20" y="230" width="84" height="24" rx="12" fill="#818cf8" opacity=".12"/><text x="34" y="247" fill="#a5b4fc" font-size="12">Yesterday</text>
    </g>
    <g transform="translate(373 325)">
      <text y="0" fill="#cbd5e1" font-size="17" font-weight="700">SCREENING</text><text x="180" fill="#64748b" font-size="16">3</text>
      <rect y="28" width="215" height="118" rx="15" fill="#172b45" stroke="#fff" stroke-opacity=".08"/>
      <circle cx="31" cy="63" r="14" fill="#34d399" opacity=".8"/><text x="55" y="68" fill="#e2e8f0" font-size="17" font-weight="600">Charlie Ruiz</text>
      <rect x="20" y="94" width="110" height="24" rx="12" fill="#34d399" opacity=".12"/><text x="34" y="111" fill="#6ee7b7" font-size="12">Review today</text>
    </g>
    <g transform="translate(618 325)">
      <text y="0" fill="#cbd5e1" font-size="17" font-weight="700">INTERVIEW</text><text x="180" fill="#64748b" font-size="16">3</text>
      <rect y="28" width="215" height="118" rx="15" fill="#172b45" stroke="#fff" stroke-opacity=".08"/>
      <circle cx="31" cy="63" r="14" fill="#fbbf24" opacity=".8"/><text x="55" y="68" fill="#e2e8f0" font-size="17" font-weight="600">Dana Lewis</text>
      <rect x="20" y="94" width="118" height="24" rx="12" fill="#fbbf24" opacity=".12"/><text x="34" y="111" fill="#fde68a" font-size="12">Sep 4 · 10:00</text>
    </g>
    <g transform="translate(863 325)">
      <text y="0" fill="#cbd5e1" font-size="17" font-weight="700">OFFER</text><text x="180" fill="#64748b" font-size="16">2</text>
      <rect y="28" width="215" height="118" rx="15" fill="#172b45" stroke="#fff" stroke-opacity=".08"/>
      <circle cx="31" cy="63" r="14" fill="#f472b6" opacity=".8"/><text x="55" y="68" fill="#e2e8f0" font-size="17" font-weight="600">Evan Scott</text>
      <rect x="20" y="94" width="90" height="24" rx="12" fill="#f472b6" opacity=".12"/><text x="34" y="111" fill="#f9a8d4" font-size="12">Sent today</text>
    </g>
